name: Tests

on:
  push:
    branches:
      - master
      - alpha
      - release-*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bazel
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 #0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Start Test Database
        uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3
        with:
          compose-file: "./compose.test.yaml"
      - name: Build Targets
        run: bazel build //...
      - name: Run Tests
        run: bazel test --test_output=errors //...

      - name: Cleanup Environment
        if: ${{ always() }}
        run: docker compose -f ./compose.test.yaml down --volumes --remove-orphans
